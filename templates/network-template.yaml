# =============================================================================
# network-template.yaml - Onward Logistics secure network for the order system
# VPC in two zones: public load balancer, private web and order servers,
# NAT gateway per zone, Session Manager access (no SSH) and a budget alert.
# =============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Onward Logistics - secure, highly available network for the order system.
  VPC in two Availability Zones, Application Load Balancer in public subnets,
  web and order servers in private subnets (Auto Scaling, min 2 each), one NAT
  gateway per zone, S3 gateway endpoint, administration through Session Manager
  only (no port 22, no keys), no inline policies, and an AWS Budgets alert.
  Deploy with CAPABILITY_NAMED_IAM.

# =============================================================================
# 1. PARAMETERS
# Values chosen at deploy time; set in network-template-deployment.yaml.
# =============================================================================
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  OwnerName:
    Type: String
    Default: Jado Fils SEZIKEYE
  LabName:
    Type: String
    Default: Designing a Secure Network for the Onward Logistics Order System
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t2.micro]
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  NatGatewayMode:
    Type: String
    Default: one-per-az
    AllowedValues: [one-per-az, single]
  MonthlyBudgetUsd:
    Type: Number
    Default: 120
    MinValue: 1
  BudgetAlertEmail:
    Type: String
    Default: ""
  ApprovedBy:
    Type: String
    Default: head-of-security

# =============================================================================
# 2. CONDITIONS
# TwoNatGateways creates NAT gateway B; HasBudgetEmail turns on budget emails.
# =============================================================================
Conditions:
  TwoNatGateways: !Equals [!Ref NatGatewayMode, one-per-az]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetAlertEmail, ""]]

Resources:
  # ===========================================================================
  # 3. VPC AND INTERNET GATEWAY
  # The private network (10.20.0.0/16) and its one door to the internet.
  # ===========================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-orders-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ===========================================================================
  # 4. SUBNETS
  # Three layers in each of two zones: public (ALB, NAT), web and order.
  # ===========================================================================
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-public-b

  WebSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-web-a

  WebSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-web-b

  OrderSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.20.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-order-a

  OrderSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.21.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-order-b

  # ===========================================================================
  # 5. NAT GATEWAYS
  # Outbound-only internet for private servers; zone B's is skipped in "single" mode.
  # ===========================================================================
  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-nat-eip-a

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-nat-a

  NatEipB:
    Type: AWS::EC2::EIP
    Condition: TwoNatGateways
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-nat-eip-b

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: TwoNatGateways
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-nat-b

  # ===========================================================================
  # 6. ROUTE TABLES AND S3 ENDPOINT
  # Public subnets route to the internet gateway; private subnets to their zone's NAT.
  # ===========================================================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-private-rt-a

  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  WebSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  OrderSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref OrderSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-private-rt-b

  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [TwoNatGateways, !Ref NatGatewayB, !Ref NatGatewayA]

  WebSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  OrderSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref OrderSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTableA
        - !Ref PrivateRouteTableB

  # ===========================================================================
  # 7. SECURITY GROUPS
  # Each layer accepts traffic only from the layer in front of it; no port 22.
  # ===========================================================================
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub onward-${Environment}-alb-sg
      GroupDescription: Load balancer - HTTP from the internet only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from merchants and customers
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-alb-sg

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub onward-${Environment}-web-sg
      GroupDescription: Web servers - HTTP from the load balancer only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: HTTP from the load balancer
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-web-sg

  OrderSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub onward-${Environment}-order-sg
      GroupDescription: Order servers - port 8080 from web servers only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref WebSecurityGroup
          Description: Order API from web servers
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-order-sg

  # ===========================================================================
  # 8. SERVER IDENTITY
  # Lets the SSM Agent reach Session Manager; AWS managed policy only, no inline policies.
  # ===========================================================================
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub onward-${Environment}-ec2-ssm-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: ApprovedBy
          Value: !Ref ApprovedBy
        - Key: Project
          Value: onward

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub onward-${Environment}-ec2-ssm-profile
      Roles:
        - !Ref InstanceRole

  # ===========================================================================
  # 9. LOAD BALANCER
  # The only internet-facing entry point: HTTP 80 in both public subnets.
  # ===========================================================================
  WebLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: PublicDefaultRoute
    Properties:
      Name: !Sub onward-${Environment}-web-alb
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-web-alb

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub onward-${Environment}-web-tg
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-web-tg

  WebListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref WebLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  # ===========================================================================
  # 10. WEB SERVERS
  # Launch template (Apache page with name and lab) and Auto Scaling group, min 2.
  # ===========================================================================
  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub onward-${Environment}-web-lt
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref WebSecurityGroup
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub onward-${Environment}-web
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub onward-${Environment}-web
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y httpd
            TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
            cat > /var/www/html/index.html <<EOF
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="utf-8"><title>Onward Logistics</title>
            <style>body{font-family:Arial,sans-serif;background:#f4f6f8;color:#232f3e;margin:0;padding:48px}
            .card{max-width:640px;margin:auto;background:#fff;border-radius:8px;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
            h1{margin-top:0}.meta{color:#545b64;font-size:14px}</style></head>
            <body><div class="card">
            <h1>Onward Logistics Order System</h1>
            <p><strong>Name:</strong> ${OwnerName}</p>
            <p><strong>Lab:</strong> ${LabName}</p>
            <p class="meta">Served by $IID in $AZ</p>
            </div></body></html>
            EOF
            systemctl enable --now httpd

  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - PrivateDefaultRouteA
      - PrivateDefaultRouteB
      - S3GatewayEndpoint
    Properties:
      AutoScalingGroupName: !Sub onward-${Environment}-web-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"
      VPCZoneIdentifier:
        - !Ref WebSubnetA
        - !Ref WebSubnetB
      TargetGroupARNs:
        - !Ref WebTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-web
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT2M

  # ===========================================================================
  # 11. ORDER SERVERS
  # Launch template (stand-in order service on 8080, not root) and Auto Scaling group, min 2.
  # ===========================================================================
  OrderLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub onward-${Environment}-order-lt
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref OrderSecurityGroup
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub onward-${Environment}-order
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub onward-${Environment}-order
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
            mkdir -p /opt/onward-orders
            echo "Onward order service (${Environment}): OK from $IID in $AZ" > /opt/onward-orders/index.html
            chmod -R a+rX /opt/onward-orders
            cat > /etc/systemd/system/onward-orders.service <<'EOF'
            [Unit]
            Description=Onward order service (lab stand-in)
            After=network-online.target
            [Service]
            ExecStart=/usr/bin/python3 -m http.server 8080 --directory /opt/onward-orders
            DynamicUser=yes
            Restart=always
            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable --now onward-orders

  OrderAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - PrivateDefaultRouteA
      - PrivateDefaultRouteB
      - S3GatewayEndpoint
    Properties:
      AutoScalingGroupName: !Sub onward-${Environment}-order-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref OrderLaunchTemplate
        Version: !GetAtt OrderLaunchTemplate.LatestVersionNumber
      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"
      VPCZoneIdentifier:
        - !Ref OrderSubnetA
        - !Ref OrderSubnetB
      HealthCheckType: EC2
      HealthCheckGracePeriod: 120
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-order
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT2M

  # ===========================================================================
  # 12. COST CONTROL
  # Monthly budget; emails at 80% actual and 100% forecast when an address is set.
  # ===========================================================================
  NetworkBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub onward-${Environment}-network-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers: !If
        - HasBudgetEmail
        - - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref BudgetAlertEmail
          - Notification:
              NotificationType: FORECASTED
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref BudgetAlertEmail
        - !Ref AWS::NoValue

# =============================================================================
# 13. OUTPUTS
# Shown on the stack's Outputs tab; used by scripts/evidence.sh.
# =============================================================================
Outputs:
  WebsiteUrl:
    Description: Open this in a browser; refresh to see both zones answer
    Value: !Sub http://${WebLoadBalancer.DNSName}
  VpcId:
    Value: !Ref Vpc
  WebAutoScalingGroupName:
    Value: !Ref WebAutoScalingGroup
  OrderAutoScalingGroupName:
    Value: !Ref OrderAutoScalingGroup
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
  WebSecurityGroupId:
    Value: !Ref WebSecurityGroup
  OrderSecurityGroupId:
    Value: !Ref OrderSecurityGroup
  NatGatewayMode:
    Value: !Ref NatGatewayMode
