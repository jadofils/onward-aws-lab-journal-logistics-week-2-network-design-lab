# =============================================================================
# network-template-deployment.yaml - CloudFormation GitSync deployment file
# Stack onward-aws-lab-journal-week-2, branch main, IAM role onward-cfn-network-deploy-role
# (created in the IAM console). Must stay at the repository root.
# =============================================================================

# =============================================================================
# 1. TEMPLATE
# The template GitSync deploys, relative to the repository root.
# =============================================================================
template-file-path: templates/network-template.yaml

# =============================================================================
# 2. PARAMETERS
# Values for the template's Parameters; NatGatewayMode "single" saves about $33 a month.
# =============================================================================
parameters:
  Environment: dev
  OwnerName: Jado Fils SEZIKEYE
  InstanceType: t3.micro
  NatGatewayMode: one-per-az
  MonthlyBudgetUsd: "120"
  BudgetAlertEmail: ""
  ApprovedBy: head-of-security

# =============================================================================
# 3. TAGS
# Company tags from the Client Profile, copied onto every taggable resource.
# =============================================================================
tags:
  Project: onward
  Owner: Jado Fils SEZIKEYE
  Environment: dev
  ManagedBy: cloudformation-gitsync
  ApprovedBy: head-of-security
